# fullR2_run.yml
# Preset configurations for the Run 2 SR/CR histogram production.
#
# The `defaults` section captures shared options, while individual profiles
# enumerate the overrides needed for a specific job type.  Select a profile at
# runtime with `python run_analysis.py --options this_file.yml:cr`.
# Command-line arguments are ignored whenever a YAML file is supplied, so embed
# any tweaks directly in the configuration before launching the workflow.
---
defaults:
  # Common EFT configuration shared across SR/CR jobs.
  do_systs: true
  wc_list:
    - ctG

  # Select the metadata bundle that drives region and variable planning.
  metadata: analysis/metadata/metadata.yml

  # Default scenario grouping used for reinterpretation studies.
  scenarios:
    - TOP_22_006

  # The base label used for output files.  Profiles append their own suffixes.
  outname: refact_250901_c1

default_profile: cr

profiles:
  sr:
    description: Signal region histogram production (skip control regions).
    jsonFiles:
      - ../../input_samples/cfgs/mc_signal_samples_NDSkim.cfg
      - ../../input_samples/cfgs/mc_background_samples_NDSkim.cfg
      - ../../input_samples/cfgs/data_samples_NDSkim.cfg
    skip_cr: true
    outname: refact_250901_c1_SRs

  cr:
    description: Control region histogram production (skip signal regions).
    jsonFiles:
      - ../../input_samples/cfgs/mc_background_samples_NDSkim_loc.cfg
    skip_sr: true
    split_lep_flavor: false
    executor: taskvine
    chunksize: 5000
    nchunks: 1
    outname: proxydebug_260303
    environment_file: /users/apiccine/work/ChUpdate/topeft/topeft-envs/env_spec_2ae74f84_edit_HEAD.tar.gz
    log_level: debug
    do_systs: false
    taskvine_manager_name: apiccine-taskvine-proxydebug11-std-fullrun
    taskvine_proxy_path: /tmp/x509up_u241575
    driver_log_path: /users/apiccine/work/ChUpdate/reports/prompt_CU005BS_fullrun.driver.log
    exit_marker_path: /users/apiccine/work/ChUpdate/reports/prompt_CU005BS_fullrun.exit_marker
    exit_debug: true

  cr_cu005bn_fullrun:
    description: CU005BN standard full_run.sh probe profile (YAML-only driver knobs).
    jsonFiles:
      - ../../input_samples/cfgs/mc_background_samples_NDSkim_loc.cfg
    skip_sr: true
    split_lep_flavor: false
    executor: taskvine
    chunksize: 5000
    nchunks: 1
    outname: cu005bn_std_fullrun
    environment_file: /users/apiccine/work/ChUpdate/topeft/topeft-envs/env_spec_2ae74f84_edit_HEAD.tar.gz
    log_level: debug
    do_systs: false
    taskvine_manager_name: apiccine-taskvine-proxydebug9-std-fullrun
    taskvine_proxy_path: /tmp/x509up_u241575
    ddr_debug: true
    ddr_worker_probe_enabled: true
    driver_log_path: /users/apiccine/work/ChUpdate/reports/prompt_CU005BN_fullrun.driver.log
    exit_marker_path: /users/apiccine/work/ChUpdate/reports/prompt_CU005BN_fullrun.exit_marker
    exit_debug: true
